name: bundle

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v4
        with:
          lfs: true

      # One zip per mode, from its folder. The importer expects the metainfo file, config/ and data/
      # at the zip root and rejects symlinks.
      - name: Zip the bundles
        run: |
          bundle() {
            (cd "$1" && zip -r -X "../$2" *.metainfo.xml config data)
            zip -r -X "$2" LICENSE NOTICE.md LICENSES
          }
          bundle light breeze-light.zip
          bundle dark breeze-dark.zip

      # One release per x-cosmic-version (both metainfo files must agree). Pushing without bumping
      # the version replaces the zips on the existing release, so releases/latest always matches main.
      - name: Publish release
        run: |
          version() { grep -oP '(?<=key="x-cosmic-version">)[^<]+' "$1"/*.metainfo.xml; }
          tag="v$(version light)"
          [ "$tag" = "v$(version dark)" ] || { echo "the light and dark metainfo versions differ"; exit 1; }
          assets="breeze-light.zip breeze-dark.zip"
          if gh release view "$tag" >/dev/null 2>&1; then
            gh release upload "$tag" $assets --clobber
          else
            gh release create "$tag" $assets --title "Breeze $tag" \
              --notes "COSMIC theme bundles, one per mode. Import breeze-light.zip or breeze-dark.zip under Settings > Desktop > Appearance."
          fi
